name: Deploy to Hostinger via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files via SSH/SFTP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "src/,package.json,package-lock.json,update.sh,deploy.sh"
          target: "~/domains/handcap-by.autogrowthid.site/nodejs"
          overwrite: true

      - name: Install dependencies and restart app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ~/domains/handcap-by.autogrowthid.site/nodejs
            # Install package (using NVM if available)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            npm install --omit=dev --silent || echo "NPM install skipped (please trigger manually from Hostinger panel if needed)"
            # Restart Passenger Node.js app (Hostinger Shared Hosting Standard)
            mkdir -p tmp
            touch tmp/restart.txt
